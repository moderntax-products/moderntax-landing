[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The product walkthroughs under /demos are framed by walkthrough.html and
# developers.html. The site-wide X-Frame-Options: DENY above would block that
# even same-origin, so these files opt down to SAMEORIGIN. They are static,
# self-contained, take no input and hold no secrets. Every other path on the
# site keeps DENY.
[[headers]]
  for = "/demos/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "frame-ancestors 'self'"

[[redirects]]
  from = "/docs"
  to = "/docs/"
  status = 301

# Two URLs that only ever existed as dead hrefs inside docs/index.html
# (the logo pointed at moderntax-redesign.html, the nav at a docs-relative
# developers.html). Both hrefs were fixed in e1fd550, but anyone who
# clicked them before that has the 404 in their history.
[[redirects]]
  from = "/docs/moderntax-redesign.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/docs/developers.html"
  to = "/developers.html"
  status = 301

[[redirects]]
  from = "/api/v1/verify"
  to = "/.netlify/functions/verify"
  status = 200

[[redirects]]
  from = "/employment-verify/*"
  to = "/.netlify/functions/employment-verify/:splat"
  status = 200
